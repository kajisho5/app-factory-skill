<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1032" viewBox="0 0 600 1032" data-bg="#F2F2F7"><rect width="100%" height="100%" fill="#F2F2F7"/><text x="24" y="34" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="600" fill="#000000" text-anchor="start">9:41</text><circle cx="30" cy="80" r="6" fill="#FF5F57"/><circle cx="50" cy="80" r="6" fill="#FEBC2E"/><circle cx="70" cy="80" r="6" fill="#28C840"/><circle cx="120" cy="80" r="22" fill="#FFFFFF" stroke="#D1D1D6"/><g fill="none" stroke="#000000" stroke-width="2"><rect x="109" y="70" width="22" height="20" rx="3"/><path d="M117 70v20"/></g><circle cx="504" cy="80" r="22" fill="#FFFFFF" stroke="#D1D1D6"/><g transform="translate(492,68) scale(1.0)" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7M3 6v13h13v-7"/><path d="M19 2l3 3-9 9h-3v-3z"/></g><circle cx="556" cy="80" r="22" fill="#FFFFFF" fill-opacity="1" stroke="#D1D1D6"/><g fill="none" stroke="#000000" stroke-width="2"><circle cx="554" cy="78" r="7"/><path d="M559 83l5 5"/></g><text x="24" y="150" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="34" font-weight="700" fill="#000000" text-anchor="start">すべての日記</text><text x="24" y="180" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#3C3C43" text-anchor="start" opacity="0.8">残り 23件（無料版は 30件まで）</text><rect x="20" y="204" width="560" height="380" rx="26" fill="#FFFFFF"/><text x="40" y="235" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#3C3C43" text-anchor="start" opacity="0.8" data-bg="#FFFFFF">10月24日（土）</text><text x="40" y="260" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start" data-bg="#FFFFFF">公園の銀杏が色づいてきた。 帰りにパン屋へ寄った。</text><path d="M548 236l6 6-6 6" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="279.5" width="540" height="0.5" fill="#C6C6C8"/><text x="40" y="311" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#3C3C43" text-anchor="start" opacity="0.8" data-bg="#FFFFFF">10月23日（金）</text><text x="40" y="336" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start" data-bg="#FFFFFF">新しいノートを使い始めた。書き心地がいい。</text><path d="M548 312l6 6-6 6" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="355.5" width="540" height="0.5" fill="#C6C6C8"/><text x="40" y="387" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#3C3C43" text-anchor="start" opacity="0.8" data-bg="#FFFFFF">10月22日（木）</text><text x="40" y="412" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start" data-bg="#FFFFFF">雨。家で本を一冊読み終えた。</text><path d="M548 388l6 6-6 6" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="431.5" width="540" height="0.5" fill="#C6C6C8"/><text x="40" y="463" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#3C3C43" text-anchor="start" opacity="0.8" data-bg="#FFFFFF">10月21日（水）</text><text x="40" y="488" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start" data-bg="#FFFFFF">朝の散歩で猫に会った。</text><path d="M548 464l6 6-6 6" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="507.5" width="540" height="0.5" fill="#C6C6C8"/><text x="40" y="539" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="15" font-weight="400" fill="#3C3C43" text-anchor="start" opacity="0.8" data-bg="#FFFFFF">10月20日（火）</text><text x="40" y="564" font-family="-apple-system, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif" font-size="17" font-weight="400" fill="#000000" text-anchor="start" data-bg="#FFFFFF">久しぶりにカレーを作った。少し辛すぎた。</text><path d="M548 540l6 6-6 6" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
