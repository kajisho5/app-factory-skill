name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and Cairo
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk libcairo2
      - name: Install Python packages
        run: pip install -r requirements.txt pyflakes
      - name: Lint scripts
        run: python -m pyflakes scripts/*.py examples/hitokoto/build.py
      - name: Rebuild the example and run the checks
        run: bash examples/hitokoto/make.sh
      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import re, sys
          t = open("SKILL.md", encoding="utf-8").read()
          fm = re.match(r"---\n(.*?)\n---", t, re.S).group(1)
          name = re.search(r"^name: (.*)$", fm, re.M).group(1)
          desc = re.search(r"^description: '(.*)'$", fm, re.M).group(1)
          ok = re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) and len(name) <= 64 and 0 < len(desc) <= 1024
          print(f"name={name} ({len(name)}), description={len(desc)} chars")
          sys.exit(0 if ok else 1)
          PY
